name: safeguard_monitor
description: A Flutter mobile conversion of the SafeGuard monitor React app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  http: ^1.1.0
  firebase_core: ^2.16.0
  firebase_auth: ^4.9.0
  cloud_firestore: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
